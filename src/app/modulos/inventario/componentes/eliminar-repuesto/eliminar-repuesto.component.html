<div class="eliminar-repuesto">
  <h2>Eliminar/Inactivar Repuesto</h2>
  <form (ngSubmit)="eliminar()" #form="ngForm">
    <div class="form-group">
      <label>Nombre del Repuesto:</label>
      <input type="text" [(ngModel)]="repuesto.nombre" name="nombre" required />
    </div>
    <div class="form-group">
      <label>Motivo de Eliminación/Inactivación:</label>
      <input type="text" [(ngModel)]="repuesto.motivo" name="motivo" required />
    </div>
    <button class="btn-acceso" type="submit">Eliminar/Inactivar</button>
  </form>
  <div *ngIf="mensajeExito" class="alert-success">{{ mensajeExito }}</div>
  <div *ngIf="mensajeError" class="alert-error">{{ mensajeError }}</div>
</div>
