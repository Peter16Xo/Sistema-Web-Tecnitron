<div class="registrar-servicio">
  <h2>Registrar Servicio</h2>
  <form (ngSubmit)="registrar()" #form="ngForm">
    <div class="form-group">
      <label>Nombre del Servicio:</label>
      <input type="text" [(ngModel)]="servicio.nombre" name="nombre" required />
    </div>
    <div class="form-group">
      <label>Precio Base:</label>
      <input type="number" [(ngModel)]="servicio.precio" name="precio" min="0.01" step="0.01" required />
    </div>
    <button class="btn-acceso" type="submit">Registrar Servicio</button>
  </form>
  <div *ngIf="mensajeExito" class="alert-success">{{ mensajeExito }}</div>
  <div *ngIf="mensajeError" class="alert-error">{{ mensajeError }}</div>
</div>
