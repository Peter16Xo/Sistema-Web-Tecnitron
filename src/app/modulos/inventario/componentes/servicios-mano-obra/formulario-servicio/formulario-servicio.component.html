<div class="container">
  
  <header class="header">
    <div class="header-content">
      <h1>{{ esNuevo ? 'Registrar Servicio' : 'Editar Servicio' }}</h1>
      <p>{{ esNuevo ? 'Añade un nuevo servicio de mano de obra al catálogo.' : 'Modifica los detalles o el precio de este servicio.' }}</p>
    </div>
  </header>

  <main class="main-content">
    
    <div *ngIf="mensajeExito" class="alert alert-success">
      ✓ {{ mensajeExito }}
    </div>
    <div *ngIf="mensajeError" class="alert alert-error">
      ✗ {{ mensajeError }}
    </div>

    <div class="formulario-card">
      <form (ngSubmit)="guardar()">
        
        <div class="form-row">
          <div class="form-group full-width">
            <label for="nombre">Nombre del Servicio *</label>
            <input type="text" id="nombre" [(ngModel)]="formulario.nombre" name="nombre" class="form-input" placeholder="Ej. Mantenimiento Preventivo" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" [(ngModel)]="formulario.descripcion" name="descripcion" class="form-input" placeholder="Detalles de lo que incluye el servicio...">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="precioBase">Precio Base ($) *</label>
            <input type="number" id="precioBase" [(ngModel)]="formulario.precioBase" name="precioBase" min="0.01" step="0.01" class="form-input" placeholder="0.00" required>
          </div>
        </div>

        <div class="form-acciones">
          <button type="submit" class="btn btn-primary">
            {{ esNuevo ? 'Guardar Servicio' : 'Actualizar Servicio' }}
          </button>
          <button type="button" class="btn btn-secondary" (click)="cancelar()">
            Cancelar
          </button>
        </div>
        
      </form>
    </div>
  </main>
</div>
