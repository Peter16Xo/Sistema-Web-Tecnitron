<!-- VISTA: Dashboard Principal
 Componente de redirección automática al dashboard del rol correspondiente
-->

<div class="dashboard-container" *ngIf="estaCargando">
  <div class="loading-spinner">
    <div class="spinner"></div>
    <p>Cargando tu panel de control...</p>
  </div>
</div>

<div class="dashboard-empty" *ngIf="!estaCargando && !usuarioAutenticado">
  <h2>Sesión no válida</h2>
  <p>Por favor, inicia sesión para continuar.</p>
</div>
